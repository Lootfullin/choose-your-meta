name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore RussianMetadata.Tests/RussianMetadata.Tests.csproj
      - run: dotnet test RussianMetadata.Tests/RussianMetadata.Tests.csproj -c Release --no-restore
      - name: Upload plugin DLL
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ChooseYourMeta-1.3.2
          path: bin/Release/net9.0/RussianMetadata.dll
          if-no-files-found: error
