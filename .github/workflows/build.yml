name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore RussianMetadata.Tests/RussianMetadata.Tests.csproj
      - run: dotnet test RussianMetadata.Tests/RussianMetadata.Tests.csproj -c Release --no-restore
      - run: node scripts/test-config-page.mjs
      - name: Build and verify release package
        if: runner.os == 'Linux'
        run: ./scripts/package.sh 1.4.8 10.11.11
      - name: Upload plugin DLL
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ChooseYourMeta-build
          path: bin/Release/net9.0/RussianMetadata.dll
          if-no-files-found: error
