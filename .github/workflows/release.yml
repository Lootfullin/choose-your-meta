name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  JELLYFIN_VERSION: 10.11.11

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Build, test and package
        shell: bash
        run: ./scripts/package.sh "${GITHUB_REF_NAME#v}" "$JELLYFIN_VERSION"
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ChooseYourMeta_*.zip
            artifacts/ChooseYourMeta_*.zip.sha256
