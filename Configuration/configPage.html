<!DOCTYPE html>
<html>
<head>
    <title>Russian Metadata</title>
</head>
<body>
    <div style="padding: 20px;">
        <h2>Russian Metadata Plugin</h2>
        <p>Fetches Russian titles and descriptions from TMDB (via proxy) or Wikidata as fallback.</p>
        
        <h3>TMDB API</h3>
        <label for="TmdbApiKey">TMDB API Key:</label>
        <input id="TmdbApiKey" name="TmdbApiKey" type="text" is="emby-input" />
        <div class="fieldDescription">Get your API key at <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org</a></div>
        
        <h3>Proxy (для TMDB)</h3>
        <label for="ProxyUrl">Proxy URL:</label>
        <input id="ProxyUrl" name="ProxyUrl" type="text" is="emby-input" placeholder="http://host:port" />
        <div class="fieldDescription">Например: http://proxy.example.com:3128</div>
        
        <label for="ProxyUsername">Proxy Username:</label>
        <input id="ProxyUsername" name="ProxyUsername" type="text" is="emby-input" />
        
        <label for="ProxyPassword">Proxy Password:</label>
        <input id="ProxyPassword" name="ProxyPassword" type="password" is="emby-input" />
        
        <h3>Настройки</h3>
        <label class="checkboxContainer">
            <input id="EnableRussianTitles" name="EnableRussianTitles" type="checkbox" is="emby-checkbox" checked />
            <span>Replace titles with Russian versions</span>
        </label>
        
        <br/>
        <label class="checkboxContainer">
            <input id="EnableRussianOverviews" name="EnableRussianOverviews" type="checkbox" is="emby-checkbox" checked />
            <span>Replace overviews with Russian descriptions</span>
        </label>
        
        <br/>
        <button is="emby-button" type="submit" class="raised button-submit" onclick="RussianMetadata.submit(this)">
            <span>Save</span>
        </button>
    </div>
</body>
</html>
